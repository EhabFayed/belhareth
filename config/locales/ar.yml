  faq_page:
    eyebrow: "الأسئلة الشائعة"
    heading_html: "كل ما تود<br><span style=\"color:#1273BF\">معرفته</span>"
    intro: "هذه هي الأسئلة الأكثر شيوعاً التي يطرحها مرضانا حول المواعيد، والجراحة، وفترة التعافي. إذا كان لديك سؤال آخر يسعدنا تواصلك مع العيادة مباشرة عبر واتساب وسنوافيك بالرد فوراً."
    group_label: "الأسئلة الشائعة"
    group_heading_html: "كل ما<br>تسألنا عنه"
    group_note: "تجد في صفحة كل تخصص أيضاً إجابات عن الأسئلة الخاصة بتلك الحالة."
    empty_html: "نعمل حالياً على إعداد الإجابات — في هذه الأثناء، <a href=\"%{wa}\" target=\"_blank\" rel=\"noopener\" class=\"link-blue\" style=\"color:#1273BF\">راسل العيادة عبر واتساب</a> وسنجيبك مباشرة."
