  about:
    eyebrow: "نبذة عن الدكتور"
    name_html: "د. محمد<br>علي <span style=\"color:#1273BF\">بالحارث</span>"
    subtitle: "استشاري جراحة العظام — استبدال وترميم مفصلي الورك والركبة · جراحة الحوادث والكسور"
    intro: "استشاري جراحة العظام الحاصل على الزمالة الكندية، ترتكز ممارسته الطبية على رؤية إنسانية واضحة: التشخيص الدقيق أولاً، الأمانة في تقديم الحلول العلاجية ثانياً، ولا نلجأ للجراحة إلا حينما تكون هي الخيار الأمثل والأنسب لمسيرة تعافيك. يتخصص الدكتور بالحارث في علاج خشونة مفاصل الورك والركبة، الكسور المعقدة الناتجة عن الحوادث، بالإضافة إلى الحالات التخصصية المعقدة مثل خلع الورك الولادي (DDH)، تنخر الورك اللاوعائي، ومضاعفات الأنيميا المنجلية في مفصل الورك."
    cred_label: "01 / المؤهلات"
    cred_heading_html: "التدريب<br>والمسيرة المهنية"
    mbbs: "بكالوريوس الطب والجراحة"
    mbbs_v: "درجة الطب بمرتبة الشرف، تليها فترة الإقامة في جراحة العظام."
    board: "البورد السعودي والشهادات الدولية"
    board_v: "معتمد في جراحة العظام من البورد السعودي والشهادات الدولية."
    fellow: "الزمالة — ترميم واستبدال مفصلي الورك والركبة"
    fellow_v: "تدريب تخصصي دقيق في عمليات استبدال المفاصل الأولية والتصحيحية."
    now: "استشاري — جراحة الورك والركبة والحوادث"
    now_v: "ممارسة جراحية نشطة، وأبحاث، وتعليم طبي في الرياض."
    phil_label: "02 / فلسفتنا العلاجية"
    phil_heading_html: "كيف نتخذ قرارك<br>العلاجي معاً؟"
    phil_intro: "كل توصية طبية نبنيها على الإجابة عن ثلاثة أسئلة، وبالترتيب التالي:"
    q1: "هل يمكننا تجنب الجراحة؟"
    q1_v: "إذا كانت الحلول التحفظية — كالعلاج الطبيعي أو الحقن — قادرة على تحسين حالتك، فستكون هي توصيتنا الأولى دائماً."
    q2: "إذا كانت الجراحة ضرورية، ما هو الإجراء الأبسط والأكثر فاعلية؟"
    q2_v: "نضع الحفاظ على مفصلك كأولوية قصوى؛ نلجأ للاستبدال الجزئي بدلاً من الكلي متى سمحت الحالة، لنحقق أفضل النتائج بأقل تدخل جراحي."
    q3: "كيف ستكون رحلة تعافيك؟"
    q3_v: "نصمم خطتك العلاجية حول احتياجاتك اليومية؛ عملك، صلاتك، وحركتك في منزلك، مع وضع أهداف واضحة وملموسة لنضمن عودتك لحياتك المعتادة بكل سلاسة."
    quote: "مهمتي ليست إجراء العمليات الجراحية؛ بل مهمتي هي أن تعود لحركتك الطبيعية، وأن أكون أميناً معك في اختيار أقصر الطرق وأكثرها أماناً للوصول إلى ذلك."
    quote_by: "— د. محمد علي بالحارث"
    memberships: "العضويات"
    member1: "الجمعية السعودية لجراحة العظام"
    member2: "الأكاديمية الأمريكية لجراحي العظام (AAOS) — عضو دولي"
    member3: "الهيئة السعودية للتخصصات الصحية (SCFHS)"
    languages: "لغات الاستشارة"
    lang_ar: "العربية"
    lang_en: "English — الإنجليزية"
    lang_note: "يتم تقديم التقارير والتعليمات ما بعد الجراحة باللغتين."
    cta_html: "هل أنت مستعد لمناقشة<br><span style=\"color:#1273BF\">حالتك المفصلية؟</span>"
  specialties:
    eyebrow: "التخصصات والخدمات"
    heading_html: "الحالات التي<br><span style=\"color:#1273BF\">نعالجها</span>"
    intro: "نقدم رعاية طبية متخصصة في ترميم المفاصل وعلاج الكسور، مع التركيز على استعادة الحركة وتحسين جودة الحياة. تشمل خبراتنا استبدال مفاصل الورك والركبة باستخدام تقنيات جراحية حديثة وطفيفة التوغل تضمن تعافياً أسرع، بالإضافة إلى خدمات متكاملة في ترميم وإصلاح كسور العظام."
  condition:
