    about_label: "01 / نبذة عن الدكتور"
    about_heading_html: "نضع راحتك<br>في قلب تخصصنا<br>الجراحي"
    about_para: "د. بالحارث استشاري حاصل على الزمالة في تخصص ترميم واستبدال مفصلي الورك والركبة للبالغين. نجمع في ممارستنا بين الدقة الجراحية والنهج الذي يضع راحة المريض كأولوية، معتمدين على أحدث الأبحاث الطبية لضمان أفضل نتائج جودة الحياة. سواء كان الأمر يتعلق بعلاج حالات الورك المعقدة (كحالات الأنيميا المنجلية وتنخر الورك) أو التعامل مع الكسور والحوادث، فإن تركيزنا هو منحك الراحة الدائمة والقدرة على استعادة حركتك الطبيعية."
    full_profile: "عرض الملف الشخصي الكامل ←"
    grid_training: "التدريب"
    grid_training_v: "الزمالة في ترميم واستبدال مفصلي الورك والركبة"
    grid_cert: "الاعتمادات"
    grid_cert_v: "البورد السعودي، والزمالات الكندية في ترميم مفصلي الورك والركبة وجراحة الحوادث والكسور"
    grid_trauma: "الكسور والحوادث"
    grid_trauma_v: "استشاري جراحة الحوادث والكسور"
    grid_academia: "أكاديمياً"
    grid_academia_v: "باحث ومعلم طبي"
    specialties_label: "02 / التخصصات"
    why_label: "03 / لماذا د. بالحارث"
    why_heading_html: "الدقة عندنا<br>ممارسة يومية،<br>وليست مجرد وعود"
    why1: "تخصص دقيق"
    why1_v: "تركيز يومي ومكثف على جراحات الورك والركبة؛ الخبرة المتراكمة هي سر دقة النتائج."
    why2: "تقنيات حديثة"
    why2_v: "نعتمد جراحات طفيفة التوغل وبروتوكولات تعافي سريعة لتستعيد نشاطك في أقل وقت."
    why3: "حالات معقدة"
    why3_v: "مرجع طبي إقليمي لعلاج حالات المفاصل المعقدة، مثل خلع الورك، التنخر، والأنيميا المنجلية."
    why4: "أمانة في التوجيه"
    why4_v: "لا نلجأ للجراحة إلا إذا كانت هي الخيار الأمثل والأنسب لصحتك."
    journey_label: "04 / رحلتك العلاجية"
    j1: "الاستشارة"
    j1_v: "نستمع إليك جيداً؛ لنتفهم طبيعة ألمك، تاريخك الصحي، وأهدافك."
    j2: "التشخيص"
    j2_v: "فحص دقيق وتشخيص شامل باستخدام أحدث تقنيات التصوير."
    j3: "خطتك العلاجية"
    j3_v: "نبدأ بالحلول التحفظية؛ ولا نلجأ للجراحة إلا إذا كانت هي الخيار الأفضل."
    j4: "الإجراء الجراحي"
    j4_v: "نستخدم أحدث التقنيات والمفاصل العالمية، مع تطبيق أعلى معايير السلامة."
    j5: "التعافي"
    j5_v: "برنامج تأهيل منظم ومتابعة مستمرة حتى تستعيد حركتك الطبيعية بالكامل."
    contact_label: "05 / التواصل والحجز"
    contact_heading_html: "ابدأ رحلة<br>تعافيك <span style=\"color:#1273BF\">اليوم</span>"
    contact_location: "📍 الرياض — مجموعة الدكتور سليمان الحبيب الطبية، مستشفى الحمراء"
