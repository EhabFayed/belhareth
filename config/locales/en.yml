    now_v: "Active surgical practice, research, and medical education in Riyadh."
    phil_label: "02 / PHILOSOPHY"
    phil_heading_html: "How I decide<br>with you"
    phil_intro: "Every recommendation follows the same three questions — in this order."
    q1: "Can we avoid surgery?"
    q1_v: "If conservative options like physiotherapy or injections can effectively address your condition, that will always be my first recommendation."
    q2: "If surgery is needed — what is the least invasive solution?"
    q2_v: "I prioritize joint preservation and partial replacements whenever anatomy allows; our goal is to achieve the best result with the simplest procedure possible."
    q3: "What does recovery look like for your life?"
    q3_v: "My plans are built around you — your work, your prayers, and your daily movement — with clear, measurable milestones for your full return to life."
    quote: "My job is not to operate. My job is to get you moving — and to be honest about the shortest safe road there."
    quote_by: "— DR. MOHAMMED ALI BALHARETH"
