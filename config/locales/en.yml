  about:
    eyebrow: "ABOUT THE DOCTOR"
    name_html: "Dr. Mohammed<br>Ali <span style=\"color:#1273BF\">Balhareth</span>"
    subtitle: "CONSULTANT — HIP & KNEE REPLACEMENT · RECONSTRUCTION · TRAUMA & FRACTURE SURGERY"
    intro: "A Canadian-fellowship-trained consultant orthopedic surgeon whose practice is built on a single, patient-centered mission: precise diagnosis, honest clinical guidance, and surgical intervention only when it is truly the best path for your recovery. Dr. Balhareth specializes in managing degenerative joint disease of the hip and knee, complex post-traumatic fractures, and specialized conditions such as developmental dysplasia (DDH), avascular necrosis, and sickle-cell disease of the hip."
